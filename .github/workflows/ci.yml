name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: M299 JSR execution-path baseline
        run: ctest --test-dir build -R '^amivm_m283
        run: ./build/amivm --dump-machine
 --verbose
      - name: Machine description
        run: ./build/amivm --dump-machine
