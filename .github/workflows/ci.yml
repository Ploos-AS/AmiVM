name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: M299 JSR execution-path baseline
        run: ctest --test-dir build -R '^amivm_m283$' --verbose
      - name: M305 repeated JIT benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for scenario in jsr-rts branch jsr-rts-mmu jsr-rts-mmu-tlb; do
            results=""
            for iteration in 1 2 3 4 5 6 7; do
              if [[ "$scenario" == "branch" ]]; then
                output=$(./build/amivm_exec_bench b)
              elif [[ "$scenario" == "jsr-rts-mmu-tlb" ]]; then
                output=$(./build/amivm_exec_bench t)
              elif [[ "$scenario" == "jsr-rts-mmu" ]]; then
                output=$(./build/amivm_exec_bench m)
              else
                output=$(./build/amivm_exec_bench)
              fi
              printf '%s\n' "$output"
              value=$(printf '%s\n' "$output" | sed -n 's/^ns_per_instruction=\([0-9.]*\).*/\1/p')
              test -n "$value"
              results="$results $value"
            done
            median=$(printf '%s\n' $results | sort -n | sed -n '4p')
            printf 'M305 scenario=%s median_ns_per_instruction=%s samples=7\n' "$scenario" "$median"
            if [[ "$scenario" == "jsr-rts-mmu" ]]; then
              mmu_off_median="$median"
            elif [[ "$scenario" == "jsr-rts-mmu-tlb" ]]; then
              mmu_on_median="$median"
            fi
          done
          # Report only: shared-runner comparison, no unstable performance gate.
          awk -v off="$mmu_off_median" -v on="$mmu_on_median" 'BEGIN {
            if (off <= 0 || on <= 0) exit 1
            printf "M330 tlb_relative_percent=%.2f (negative=faster) off_ns=%.3f on_ns=%.3f\n", 100 * (on / off - 1), off, on
          }'
      - name: M331 interleaved paired TLB comparison
        shell: bash
        run: |
          set -euo pipefail
          ratios=""
          for iteration in 1 2 3 4 5 6 7; do
            # Alternate order to reduce systematic first/second-run bias.
            if (( iteration % 2 == 1 )); then
              modes=(m t)
            else
              modes=(t m)
            fi
            for mode in "${modes[@]}"; do
              output=$(./build/amivm_exec_bench "$mode")
              value=$(printf '%s\n' "$output" | sed -n 's/^ns_per_instruction=\([0-9.]*\).*/\1/p')
              test -n "$value"
              if [[ "$mode" == "m" ]]; then off="$value"; else on="$value"; fi
            done
            ratio=$(awk -v off="$off" -v on="$on" 'BEGIN {
              if (off <= 0 || on <= 0) exit 1
              printf "%.4f", 100 * (on / off - 1)
            }')
            printf 'M331 pair=%s off_ns=%s on_ns=%s relative_percent=%s\n' "$iteration" "$off" "$on" "$ratio"
            ratios="$ratios $ratio"
          done
          median=$(printf '%s\n' $ratios | sort -n | sed -n '4p')
          printf 'M331 paired_median_relative_percent=%s samples=7 (negative=faster)\n' "$median"
      - name: M351 three-way DMA/TLB coherence benchmark
        shell: bash
        run: |
          set -euo pipefail
          same_samples=""
          unrelated_samples=""
          revalidated_samples=""
          for iteration in 1 2 3 4 5 6 7; do
            output=$(./build/amivm_tlb_dma_bench)
            printf '%s\n' "$output"
            same=$(printf '%s\n' "$output" | sed -n 's/^scenario=same-descriptor-page .*ns_per_iteration=\([0-9.]*\).*/\1/p')
            unrelated=$(printf '%s\n' "$output" | sed -n 's/^scenario=unrelated-page .*ns_per_iteration=\([0-9.]*\).*/\1/p')
            revalidated=$(printf '%s\n' "$output" | sed -n 's/^scenario=same-descriptor-page-revalidate .*ns_per_iteration=\([0-9.]*\).*/\1/p')
            test -n "$same" && test -n "$unrelated" && test -n "$revalidated"
            same_samples="$same_samples $same"
            unrelated_samples="$unrelated_samples $unrelated"
            revalidated_samples="$revalidated_samples $revalidated"
          done
          same_median=$(printf '%s\n' $same_samples | sort -n | sed -n '4p')
          unrelated_median=$(printf '%s\n' $unrelated_samples | sort -n | sed -n '4p')
          revalidated_median=$(printf '%s\n' $revalidated_samples | sort -n | sed -n '4p')
          printf 'M351 same_page_ns=%s unrelated_page_ns=%s revalidated_ns=%s samples=7\n' "$same_median" "$unrelated_median" "$revalidated_median"
          awk -v same="$same_median" -v unrelated="$unrelated_median" -v revalidated="$revalidated_median" 'BEGIN {
            if (same <= 0 || unrelated <= 0 || revalidated <= 0) exit 1
            printf "M351 revalidated_vs_same_percent=%.2f revalidated_vs_unrelated_percent=%.2f (report only)\n", 100 * (revalidated / same - 1), 100 * (revalidated / unrelated - 1)
          }'
      - name: M354 paired stable TLB hit comparison
        shell: bash
        run: |
          set -euo pipefail
          ratios=""
          for iteration in 1 2 3 4 5 6 7; do
            if (( iteration % 2 == 1 )); then
              output=$(./build/amivm_tlb_stable_bench)
            else
              output=$(./build/amivm_tlb_stable_bench reverse)
            fi
            printf '%s\n' "$output"
            off=$(printf '%s\n' "$output" | sed -n 's/^scenario=revalidation-off .*ns_per_hit=\([0-9.]*\).*/\1/p')
            on=$(printf '%s\n' "$output" | sed -n 's/^scenario=revalidation-on .*ns_per_hit=\([0-9.]*\).*/\1/p')
            test -n "$off" && test -n "$on"
            ratio=$(awk -v off="$off" -v on="$on" 'BEGIN {
              if (off <= 0 || on <= 0) exit 1
              printf "%.4f", 100 * (on / off - 1)
            }')
            printf 'M354 pair=%s off_ns=%s on_ns=%s relative_percent=%s\n' "$iteration" "$off" "$on" "$ratio"
            ratios="$ratios $ratio"
          done
          median=$(printf '%s\n' $ratios | sort -n | sed -n '4p')
          printf 'M354 paired_median_relative_percent=%s samples=7 (negative=faster, report only)\n' "$median"
      - name: M357 paired mixed DMA/TLB comparison
        shell: bash
        run: |
          set -euo pipefail
          ratios=""
          for iteration in 1 2 3 4 5 6 7; do
            if (( iteration % 2 == 1 )); then
              output=$(./build/amivm_tlb_mixed_bench)
            else
              output=$(./build/amivm_tlb_mixed_bench reverse)
            fi
            printf '%s\n' "$output"
            off=$(printf '%s\n' "$output" | sed -n 's/^scenario=mixed-conservative .*ns_per_iteration=\([0-9.]*\).*/\1/p')
            on=$(printf '%s\n' "$output" | sed -n 's/^scenario=mixed-revalidate .*ns_per_iteration=\([0-9.]*\).*/\1/p')
            test -n "$off" && test -n "$on"
            ratio=$(awk -v off="$off" -v on="$on" 'BEGIN {
              if (off <= 0 || on <= 0) exit 1
              printf "%.4f", 100 * (on / off - 1)
            }')
            printf 'M357 pair=%s conservative_ns=%s revalidated_ns=%s relative_percent=%s\n' "$iteration" "$off" "$on" "$ratio"
            ratios="$ratios $ratio"
          done
          median=$(printf '%s\n' $ratios | sort -n | sed -n '4p')
          printf 'M357 paired_median_relative_percent=%s samples=7 (negative=faster, report only)\n' "$median"
      - name: Machine description
        run: ./build/amivm --dump-machine
